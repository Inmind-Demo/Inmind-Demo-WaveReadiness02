name: DynamicsCon - Page Scripting 12 - Create Second Vendor
description: Create a second vendor named Page Scripting 2 using Vendor Person template
telemetryId: a1b2c3d4-e5f6-4012-8001-000000000012
start:
  profile: PAGE SCRIPTING
steps:
  - type: navigate
    target:
      - page: Business Manager Role Center
      - action: Vendors
    description: Navigate to <caption>Vendors</caption>
  - type: page-shown
    source:
      page: Vendor List
    modal: false
    runtimeId: d201
    description: Page <caption>Vendors</caption> was shown.
  - type: invoke
    target:
      - page: Vendor List
        runtimeRef: d201
      - action: Control_New
    invokeType: New
    description: Invoke New on <caption>New</caption>
  - type: scope
    condition:
      type: page-shown
      source:
        page: Select Vendor Templ. List
      runtimeId: d202
    steps:
      - type: input
        target:
          - page: Select Vendor Templ. List
            runtimeRef: d202
          - scope: filter
            field: filter:system:search
        value: Vendor Person
        isFilterAsYouType: true
        description: Input <value>Vendor Person</value> into <caption>Search</caption>
      - type: invoke
        target:
          - page: Select Vendor Templ. List
            runtimeRef: d202
        invokeType: LookupOk
        description: Invoke LookupOk on <caption>Select a template for a new vendor</caption>
      - type: page-closed
        source:
          page: Select Vendor Templ. List
        runtimeId: d202
        description: Page <caption>Select a template for a new vendor</caption> was closed.
    description: If Page <caption>Select a template for a new vendor</caption> was shown.
  - type: page-shown
    source:
      page: Vendor Card
    modal: false
    runtimeId: d203
    description: Page <caption>Vendor Card</caption> was shown.
  - type: input
    target:
      - page: Vendor Card
        runtimeRef: d203
      - field: Name
    value: Page Scripting 2
    description: Input <value>Page Scripting 2</value> into <caption>Name</caption>
  - type: input
    target:
      - page: Vendor Card
        runtimeRef: d203
      - field: Tax Liable
    value: true
    description: Input <value>true</value> into <caption>Tax Liable</caption>
  - type: invoke
    target:
      - page: Vendor Card
        runtimeRef: d203
      - field: Tax Area Code
    invokeType: Lookup
    description: Invoke Lookup on <caption>Tax Area Code</caption>
  - type: page-shown
    source:
      page: lookup:Tax Area Code
    modal: false
    runtimeId: d204
    description: Page <caption>Select</caption> was shown.
  - type: invoke
    target:
      - page: lookup:Tax Area Code
        runtimeRef: d204
      - action: system:fulllist
    description: Invoke <caption>Select from full list</caption>
  - type: page-closed
    source:
      page: lookup:Tax Area Code
    runtimeId: d204
    description: Page <caption>Select</caption> was closed.
  - type: page-shown
    source:
      page: Tax Area List
    modal: false
    runtimeId: d205
    description: Page <caption>Select - Tax Areas</caption> was shown.
  - type: input
    target:
      - page: Tax Area List
        runtimeRef: d205
      - scope: filter
        field: filter:system:search
    value: MIAMI
    isFilterAsYouType: true
    description: Input <value>MIAMI</value> into <caption>Search</caption>
  - type: invoke
    target:
      - page: Tax Area List
        runtimeRef: d205
    invokeType: LookupOk
    description: Invoke LookupOk on <caption>Select - Tax Areas</caption>
  - type: page-closed
    source:
      page: Tax Area List
    runtimeId: d205
    description: Page <caption>Select - Tax Areas</caption> was closed.
  - type: close-page
    target:
      - page: Vendor Card
        runtimeRef: d203
    description: Close page <caption>Vendor Card</caption>
  - type: page-closed
    source:
      page: Vendor Card
    runtimeId: d203
    description: Page <caption>Vendor Card</caption> was closed.
  - type: close-page
    target:
      - page: Vendor List
        runtimeRef: d201
    description: Close page <caption>Vendors</caption>
  - type: page-closed
    source:
      page: Vendor List
    runtimeId: d201
    description: Page <caption>Vendors</caption> was closed.
