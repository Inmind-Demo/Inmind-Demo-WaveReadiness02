name: DynamicsCon - Page Scripting 1 - Create Vendor
description: Test recording
telemetryId: d3309c56-2897-4c62-8129-db8d0569e3cf
start:
  profile: PAGE SCRIPTING
steps:
  - type: navigate
    target:
      - page: Business Manager Role Center
      - action: Vendors
    description: Navigate to <caption>Vendors</caption>
