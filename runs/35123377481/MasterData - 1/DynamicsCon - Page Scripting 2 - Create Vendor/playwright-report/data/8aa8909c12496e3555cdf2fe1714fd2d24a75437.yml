    description: Invoke New on <caption>New</caption>
  - type: scope
    condition:
      type: page-shown
      source:
        page: Select Vendor Templ. List
      runtimeId: bbwh
    steps:
      - type: input
        target:
          - page: Select Vendor Templ. List
            runtimeRef: bbwh
          - scope: filter
            field: filter:system:search
        value: Vendor Person
        isFilterAsYouType: true
        description: Input <value>Vendor Person</value> into <caption>Search</caption>
      - type: invoke
        target:
          - page: Select Vendor Templ. List
            runtimeRef: bbwh
        invokeType: LookupOk
        description: Invoke LookupOk on <caption>Select a template for a new
          vendor</caption>
      - type: page-closed
        source:
          page: Select Vendor Templ. List
        runtimeId: bbwh
        description: Page <caption>Select a template for a new vendor</caption> was closed.
    description: If Page <caption>Select a template for a new vendor</caption> was shown.
  - type: page-shown
