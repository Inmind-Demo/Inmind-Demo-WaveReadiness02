name: DynamicsCon - Page Scripting 18 - Open Vendor Validate Name
description: Open existing Page Scripting vendor card and validate Name field
telemetryId: a1b2c3d4-e5f6-4018-8001-000000000018
start:
  profile: PAGE SCRIPTING
steps:
  - type: navigate
    target:
      - page: Business Manager Role Center
      - action: Vendors
    description: Navigate to <caption>Vendors</caption>
  - type: page-shown
    source:
      page: Vendor List
    modal: false
    runtimeId: d801
    description: Page <caption>Vendors</caption> was shown.
  - type: invoke
    target:
      - page: Vendor List
        runtimeRef: d801
      - repeater: Control1
      - field: Name
    invokeType: FilterByColumn
    parameters:
      UseAdvancedFiltering: true
    description: Invoke FilterByColumn on <caption>Name</caption>
  - type: input
    target:
      - page: Vendor List
        runtimeRef: d801
      - scope: filter
        field: Name
    value: Page Scripting
    description: Input <value>Page Scripting</value> into <caption>Name</caption>
  - type: invoke
    target:
      - page: Vendor List
        runtimeRef: d801
      - repeater: Control1
    invokeType: Edit
    parameters:
      AlwaysCommit: false
    description: Invoke row on <caption>Control1</caption>
  - type: page-shown
    source:
      page: Vendor Card
    modal: false
    runtimeId: d802
    description: Page <caption>Vendor Card</caption> was shown.
  - type: validate
    target:
      - page: Vendor Card
        runtimeRef: d802
      - field: Name
    operation: =
    value: Page Scripting
    description: Validate <caption>Name</caption> <operation>is</operation> <value>Page Scripting</value>
  - type: close-page
    target:
      - page: Vendor Card
        runtimeRef: d802
    description: Close page <caption>Vendor Card</caption>
  - type: page-closed
    source:
      page: Vendor Card
    runtimeId: d802
    description: Page <caption>Vendor Card</caption> was closed.
  - type: close-page
    target:
      - page: Vendor List
        runtimeRef: d801
    description: Close page <caption>Vendors</caption>
  - type: page-closed
    source:
      page: Vendor List
    runtimeId: d801
    description: Page <caption>Vendors</caption> was closed.
