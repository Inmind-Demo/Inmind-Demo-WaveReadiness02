name: 'Acquire Entra access token'
description: >
  Client-credentials OAuth flow against an Entra tenant. Used by the Wave
  Readiness workflow to mint tokens for both the BC admin API and Microsoft
  Graph. The flow itself lives in .github/scripts/Get-EntraToken.ps1, which
  the long polls in copy-and-upgrade also call from inside their loops so a
  token can be renewed mid-poll; that script emits ::add-mask:: so the token
  is never surfaced in the run log, even if a later step accidentally echoes
  it. Requires a checkout, like any local action.

inputs:
  tenant-id:
    description: 'Entra tenant ID.'
    required: true
  client-id:
    description: 'Entra app (client) ID.'
    required: true
  client-secret:
    description: 'Entra app client secret.'
    required: true
  scope:
    description: "OAuth scope, e.g. 'https://graph.microsoft.com/.default' or 'https://api.businesscentral.dynamics.com/.default'."
    required: true

outputs:
  token:
    description: 'Bearer access token.'
    value: ${{ steps.fetch.outputs.token }}

runs:
  using: composite
  steps:
    - id: fetch
      shell: pwsh
      env:
        TENANT_ID: ${{ inputs.tenant-id }}
        CLIENT_ID: ${{ inputs.client-id }}
        CLIENT_SECRET: ${{ inputs.client-secret }}
        SCOPE: ${{ inputs.scope }}
      run: |
        $ErrorActionPreference = 'Stop'
        $token = & "$env:GITHUB_WORKSPACE/.github/scripts/Get-EntraToken.ps1" `
          -TenantId $env:TENANT_ID -ClientId $env:CLIENT_ID `
          -ClientSecret $env:CLIENT_SECRET -Scope $env:SCOPE
        "token=$token" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
